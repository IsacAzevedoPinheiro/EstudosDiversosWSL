name: Autograding Tests
'on':
- workflow_dispatch
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Case 1
      id: case-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Case 1
        setup-command: gcc -o executable geracao.c
        command: echo "20;Maria;\n32;Joao;\n31;Mirtes;\n21;Mariana;\n34;Matheus;"
          > entrada.txt & (echo 6) | ./executable
        input: ''
        expected-output: |-
          *** p1.txt
          20;Maria;
          21;Mariana;
          31;Mirtes;
          32;Joao;
          34;Matheus;
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Case 2
      id: case-2
      uses: classroom-resources/autograding-io-grader@v1
